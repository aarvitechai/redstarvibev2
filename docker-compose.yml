# Phase 15: the whole system in containers, wired the way production is:
#
#   browser ──► react  (nginx :8081) ──┐  /api, /images
#   browser ──► angular(nginx :8082) ──┼──────────────► api (:8080, NOT published) ──► db (SQL Server, NOT published)
#                                      │
#   migrate: runs ONCE before the API starts, applies pending migrations, exits
#
# Secrets come from a .env file next to this one (git-ignored). Copy .env.example to .env and fill it in.
#   docker compose up --build        then open http://localhost:8081 (React) or http://localhost:8082 (Angular)
#   docker compose down              (add -v to also delete the database and uploaded images)

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    build: { context: ./server, target: migrate }
    command: ["--connection", "Server=db;Database=RedStarVibeDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ./server, target: api }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=RedStarVibeDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (at least 32 random characters)}
      # Only the nginx containers can reach the API (no "ports:" below), so their X-Forwarded-For is trusted
      ForwardedHeaders__Enabled: "true"
      # The first admin (created only while there is no admin yet). Remove from .env after the first start.
      Auth__BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Auth__BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  react:
    build: { context: ./client-react }
    ports: ["8081:80"]
    depends_on: [api]
    restart: unless-stopped

  angular:
    build: { context: ./client-angular }
    ports: ["8082:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  sqldata:
  uploads:
