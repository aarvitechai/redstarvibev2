# Phase 15: the React app in production. nginx serves the built files, and PROXIES /api and /images to the API
# container, so the browser sees ONE origin: no CORS, and the API itself is never exposed to the internet.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;   # don't advertise the nginx version

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- the API, behind this proxy ---
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # OVERWRITE (not append) the client address: a value the browser sent itself is never passed on
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;   # the API allows 2 MB images; reject bigger uploads here already
    }
    location /images/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # --- hashed build files (index-DoCjagbM.js): the name changes with the content, so cache for a year ---
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        try_files $uri =404;   # a missing asset is a real 404, never index.html
    }

    # --- SPA FALLBACK: /products/4 is a CLIENT route; serve index.html and let React Router handle it ---
    location / {
        include /etc/nginx/security-headers.conf;
        expires -1;   # index.html must never be cached, or users keep loading an old release
        try_files $uri $uri/ /index.html;
    }
}
