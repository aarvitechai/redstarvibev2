# Security headers for the PAGES. (Included per location: in nginx, an add_header inside a location
# replaces every add_header from the server block, an easy way to lose them silently.)
# CSP: scripts ONLY from our own origin (no inline scripts, no eval), so injected markup can't run code.
# 'unsafe-inline' for STYLES only: libraries such as react-toastify inject <style> tags; inline styles can't run code.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
