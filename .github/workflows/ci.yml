# Phase 15: CONTINUOUS INTEGRATION. Every push and pull request builds and tests all three apps.
# To make a red build BLOCK a merge: GitHub → Settings → Branches → add a rule for "main" →
# "Require status checks to pass" → tick: api, react, angular, docker.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older, still-running build
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: this workflow only reads the code

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      # A REAL SQL Server for the integration tests (each test class creates its own RedStarVibeDb_Test_* database)
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Only-Str0ng!   # a throwaway container that lives for this job only
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Only-Str0ng!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 20s
    env:
      TEST_SQLSERVER_CONNECTION: "Server=localhost,1433;User Id=sa;Password=Ci-Only-Str0ng!;TrustServerCertificate=True"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore server/Server.slnx
      - name: Build
        run: dotnet build server/Server.slnx --no-restore -c Release
      - name: Test
        run: dotnet test server/Server.slnx --no-build -c Release --logger "trx;LogFileName=results.trx"
      - name: Vulnerable packages (fails the build if any)
        run: |
          dotnet list server/Server.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      - name: Migration script (reviewed and applied as a CONTROLLED release step, never on app start)
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet ef migrations script --idempotent --project server/Server.Api --configuration Release --no-build -o artifacts/migrate.sql
      - name: Publish
        run: dotnet publish server/Server.Api -c Release --no-build -o artifacts/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api
          path: |
            artifacts/
            server/Server.Tests/TestResults/

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - name: Audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api
      - uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: client-react/dist/

  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client-angular/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - name: Audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npx ng build --configuration production
      - uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: client-angular/dist/client-angular/browser/

  # The container images must BUILD (they are not pushed anywhere: deployment needs a registry and a target)
  docker:
    runs-on: ubuntu-latest
    needs: [api, react, angular]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose --env-file .env.example build
